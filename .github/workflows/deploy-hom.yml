name: Deploy HOM

on:
  push:
    branches: [hom]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations (HOM)
        run: pnpm supabase db push --project-ref ${{ secrets.SUPABASE_HOM_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Trigger Coolify deploy (API HOM)
        run: |
          curl --silent --fail --show-error \
            -X GET "${{ secrets.COOLIFY_HOM_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

  # Vercel deploy handled automatically via Vercel GitHub integration
  # hom branch → HOM environment in Vercel
